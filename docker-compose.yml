services:
  backend:
    build: ./AppWeb/BACKEND
    ports:
      - "8000:8000"
    env_file:
      - ./AppWeb/BACKEND/.env
    environment:
      # Sobreescribe DATABASE_URL del .env: guarda la BD DENTRO del volumen
      # cortex_db (carpeta /app/data) para que NO se borre al reconstruir.
      # Son 4 barras porque es una ruta absoluta: sqlite:/// + /app/data/...
      - DATABASE_URL=sqlite:////app/data/cortex.db
      # Sobreescribe REDIS_URL del .env: dentro de Docker el host NO es localhost,
      # sino el nombre del servicio (redis), resuelto por la red interna de compose.
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./AppWeb/BACKEND/Storage:/app/Storage
      - ./AppWeb/BACKEND/Logs:/app/Logs
      - ./AppWeb/BACKEND/Cache:/app/Cache
      - cortex_db:/app/data        # cajón persistente donde vive cortex.db
    depends_on:
      - redis

  # Servidor Redis: cache en memoria.
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data        # persiste los datos para que el contador sobreviva a reinicios

  frontend:
    build:
      context: ./AppWeb/FRONTEND
      args:
        # Se inyecta en el build para que VITE_API_URL quede congelado en el
        # frontend compilado (sin esto quedaria "undefined" y romperia las
        # imagenes servidas desde /storage del backend).
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Opcional, cuando migres de SQLite:
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: cortex
  #     POSTGRES_PASSWORD: cortex
  #     POSTGRES_DB: cortex
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  cortex_db:
  redis_data:
  # pg_data:
