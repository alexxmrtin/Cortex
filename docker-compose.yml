services:
  backend:
    build: ./AppWeb/BACKEND
    ports:
      - "8000:8000"
    env_file:
      - ./AppWeb/BACKEND/.env
    environment:
      # Sobreescribe DATABASE_URL del .env: guarda la BD DENTRO del volumen
      # cortex_db (carpeta /app/data) para que NO se borre al reconstruir.
      # Son 4 barras porque es una ruta absoluta: sqlite:/// + /app/data/...
      - DATABASE_URL=sqlite:////app/data/cortex.db
    volumes:
      - ./AppWeb/BACKEND/Storage:/app/Storage
      - ./AppWeb/BACKEND/Logs:/app/Logs
      - ./AppWeb/BACKEND/Cache:/app/Cache
      - cortex_db:/app/data        # cajón persistente donde vive cortex.db

  frontend:
    build: ./AppWeb/FRONTEND
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Opcional, cuando migres de SQLite:
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: cortex
  #     POSTGRES_PASSWORD: cortex
  #     POSTGRES_DB: cortex
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  cortex_db:
  # pg_data:
